<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Student Account — CampusBite</title>
  <link rel="stylesheet" href="/css/styles.css" />
  <link rel="stylesheet" href="/css/student.css" />
</head>
<body>

  <!-- Navigation Bar -->
  <header class="navbar">
    <div class="container nav-container">
      <a href="/index.html" class="brand-logo">
        <span class="brand-icon">CB</span>
        <span>Campus<span class="brand-accent">Bite</span></span>
      </a>
      <div class="nav-actions">
        <a href="/login.html" class="btn btn-outline btn-sm">Already Registered? Log In</a>
      </div>
    </div>
  </header>

  <main class="container">
    <div class="auth-wrapper card">
      <div class="auth-header">
        <div class="brand-icon" style="margin: 0 auto 1rem; width:48px; height:48px; font-size:1.5rem;">CB</div>
        <h1>Create Student Account</h1>
        <p class="text-muted">Join CampusBite to order food online with zero wait time</p>
      </div>

      <div id="register-alert" class="alert alert-danger" style="display:none;"></div>
      <div id="register-success" class="alert alert-success" style="display:none;"></div>

      <form id="register-form" novalidate>
        <div class="form-group">
          <label class="form-label" for="reg-name">Full Name</label>
          <input type="text" id="reg-name" class="form-control" placeholder="Aarav Sharma" required autocomplete="name" />
          <div id="name-error" class="form-error">Please enter your full name.</div>
        </div>

        <div class="form-group">
          <label class="form-label" for="reg-email">Campus Email</label>
          <input type="email" id="reg-email" class="form-control" placeholder="aarav.s@university.edu" required autocomplete="email" />
          <div id="email-error" class="form-error">Please enter a valid email address.</div>
        </div>

        <div class="form-group">
          <label class="form-label" for="reg-password">Password</label>
          <div class="password-input-wrapper">
            <input type="password" id="reg-password" class="form-control" placeholder="Minimum 6 characters" required autocomplete="new-password" />
            <button type="button" class="password-toggle-btn" data-target="reg-password" aria-label="Toggle password visibility">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
            </button>
          </div>
          <div id="password-error" class="form-error">Password must be at least 6 characters.</div>
        </div>

        <div class="form-group">
          <label class="form-label" for="reg-confirm-password">Confirm Password</label>
          <div class="password-input-wrapper">
            <input type="password" id="reg-confirm-password" class="form-control" placeholder="Re-enter password" required autocomplete="new-password" />
            <button type="button" class="password-toggle-btn" data-target="reg-confirm-password" aria-label="Toggle password visibility">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
            </button>
          </div>
          <div id="confirm-error" class="form-error">Passwords do not match.</div>
        </div>

        <button type="submit" id="register-submit-btn" class="btn btn-primary btn-full btn-lg" style="margin-top:1rem;">
          Register Account
        </button>
      </form>

      <div class="auth-footer-text">
        Already have an account? <a href="/login.html">Sign In Here</a>
      </div>
    </div>
  </main>

  <script src="/js/config.js"></script>
  <script src="/js/utils.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      Utils.initPasswordToggles();

      const form = document.getElementById('register-form');
      const nameInput = document.getElementById('reg-name');
      const emailInput = document.getElementById('reg-email');
      const passInput = document.getElementById('reg-password');
      const confirmInput = document.getElementById('reg-confirm-password');

      const nameErr = document.getElementById('name-error');
      const emailErr = document.getElementById('email-error');
      const passErr = document.getElementById('password-error');
      const confirmErr = document.getElementById('confirm-error');
      const alertBox = document.getElementById('register-alert');
      const successBox = document.getElementById('register-success');
      const submitBtn = document.getElementById('register-submit-btn');

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        [nameErr, emailErr, passErr, confirmErr].forEach(el => el.classList.remove('visible'));
        alertBox.style.display = 'none';
        successBox.style.display = 'none';

        const name = nameInput.value.trim();
        const email = emailInput.value.trim();
        const password = passInput.value;
        const confirmPassword = confirmInput.value;

        let valid = true;
        if (!name || name.length < 2) {
          nameErr.classList.add('visible');
          valid = false;
        }

        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        if (!email || !emailRegex.test(email)) {
          emailErr.classList.add('visible');
          valid = false;
        }

        if (!password || password.length < 6) {
          passErr.classList.add('visible');
          valid = false;
        }

        if (password !== confirmPassword) {
          confirmErr.classList.add('visible');
          valid = false;
        }

        if (!valid) return;

        submitBtn.disabled = true;
        submitBtn.innerHTML = '<span>⏳ Creating Account...</span>';

        try {
          const res = await fetch(`${CONFIG.API_BASE}/auth/register`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name, email, password, confirmPassword })
          });

          const data = await res.json();
          if (res.ok && data.success) {
            successBox.textContent = 'Account created successfully! Redirecting to login...';
            successBox.style.display = 'flex';
            setTimeout(() => {
              window.location.href = '/login.html';
            }, 1200);
          } else {
            alertBox.textContent = data.error || 'Registration failed. Please check your details.';
            alertBox.style.display = 'flex';
            submitBtn.disabled = false;
            submitBtn.innerHTML = 'Register Account';
          }
        } catch (err) {
          alertBox.textContent = 'Server connection failed. Please ensure the backend is running.';
          alertBox.style.display = 'flex';
          submitBtn.disabled = false;
          submitBtn.innerHTML = 'Register Account';
        }
      });
    });
  </script>
</body>
</html>
