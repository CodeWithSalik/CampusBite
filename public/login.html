<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — CampusBite</title>
  <link rel="stylesheet" href="/css/styles.css" />
  <link rel="stylesheet" href="/css/student.css" />
</head>
<body>

  <!-- Navigation Bar -->
  <header class="navbar">
    <div class="container nav-container">
      <a href="/index.html" class="brand-logo">
        <span class="brand-icon">CB</span>
        <span>Campus<span class="brand-accent">Bite</span></span>
      </a>
      <div class="nav-actions">
        <a href="/register.html" class="btn btn-outline btn-sm">Create Account</a>
      </div>
    </div>
  </header>

  <main class="container">
    <div class="auth-wrapper card">
      <div class="auth-header">
        <div class="brand-icon" style="margin: 0 auto 1rem; width:48px; height:48px; font-size:1.5rem;">CB</div>
        <h1>Welcome Back</h1>
        <p class="text-muted">Sign in with your campus email to continue</p>
      </div>

      <div id="login-alert" class="alert alert-danger" style="display:none;"></div>

      <form id="login-form" novalidate>
        <div class="form-group">
          <label class="form-label" for="login-email">Campus Email</label>
          <input type="email" id="login-email" class="form-control" placeholder="student@university.edu" required autocomplete="email" />
          <div id="email-error" class="form-error">Please enter a valid email address.</div>
        </div>

        <div class="form-group">
          <label class="form-label" for="login-password">Password</label>
          <div class="password-input-wrapper">
            <input type="password" id="login-password" class="form-control" placeholder="••••••••" required autocomplete="current-password" />
            <button type="button" class="password-toggle-btn" data-target="login-password" aria-label="Toggle password visibility">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
            </button>
          </div>
          <div id="password-error" class="form-error">Password must be at least 6 characters.</div>
        </div>

        <button type="submit" id="login-submit-btn" class="btn btn-primary btn-full btn-lg" style="margin-top:1rem;">
          Sign In
        </button>
      </form>

      <div class="auth-footer-text">
        Don't have an account yet? <a href="/register.html">Sign Up for CampusBite</a>
      </div>
    </div>
  </main>

  <script src="/js/config.js"></script>
  <script src="/js/utils.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      Utils.initPasswordToggles();

      const form = document.getElementById('login-form');
      const emailInput = document.getElementById('login-email');
      const passInput = document.getElementById('login-password');
      const emailErr = document.getElementById('email-error');
      const passErr = document.getElementById('password-error');
      const alertBox = document.getElementById('login-alert');
      const submitBtn = document.getElementById('login-submit-btn');

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        emailErr.classList.remove('visible');
        passErr.classList.remove('visible');
        alertBox.style.display = 'none';

        const email = emailInput.value.trim();
        const password = passInput.value;

        let valid = true;
        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        if (!email || !emailRegex.test(email)) {
          emailErr.classList.add('visible');
          valid = false;
        }

        if (!password || password.length < 6) {
          passErr.classList.add('visible');
          valid = false;
        }

        if (!valid) return;

        submitBtn.disabled = true;
        submitBtn.innerHTML = '<span>⏳ Signing in...</span>';

        try {
          const res = await fetch(`${CONFIG.API_BASE}/auth/login`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password })
          });

          const data = await res.json();
          if (res.ok && data.success) {
            Utils.setStorage(CONFIG.STORAGE_KEYS.USER, data.user);
            Utils.showToast('Login successful! Redirecting...', 'success');
            setTimeout(() => {
              if (data.user.role === 'admin') {
                window.location.href = '/admin.html';
              } else {
                window.location.href = '/menu.html';
              }
            }, 600);
          } else {
            alertBox.textContent = data.error || 'Invalid email or password.';
            alertBox.style.display = 'flex';
            submitBtn.disabled = false;
            submitBtn.innerHTML = 'Sign In';
          }
        } catch (err) {
          alertBox.textContent = 'Server connection failed. Please ensure the backend is running.';
          alertBox.style.display = 'flex';
          submitBtn.disabled = false;
          submitBtn.innerHTML = 'Sign In';
        }
      });
    });
  </script>
</body>
</html>
